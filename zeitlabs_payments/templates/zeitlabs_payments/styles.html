{% load i18n %}

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ============================================
   EDUBA Payment System - Modern RTL-First Design
   ============================================ */

/* CSS Custom Properties (Design Tokens) */
:root {
  /* Primary Colors - Coral/Red */
  --color-primary: #E85A4F;
  --color-primary-dark: #D14B41;
  --color-primary-light: #FF6B5E;
  
  /* Secondary Colors - Purple/Navy */
  --color-secondary: #2D3561;
  --color-secondary-dark: #1E2448;
  --color-secondary-light: #3D4571;
  
  /* Accent Colors */
  --color-accent-teal: #4ECDC4;
  --color-accent-purple: #7C4DFF;
  --color-accent-pink: #FF6B9D;
  
  /* Success/Error/Warning */
  --color-success: #43B666;
  --color-success-light: #E8F5E9;
  --color-error: #E53935;
  --color-error-light: #FFEBEE;
  --color-warning: #FF9800;
  --color-warning-light: #FFF3E0;
  --color-info: #2196F3;
  --color-info-light: #E3F2FD;
  
  /* Neutrals */
  --color-white: #FFFFFF;
  --color-gray-50: #FAFAFA;
  --color-gray-100: #F5F5F5;
  --color-gray-200: #EEEEEE;
  --color-gray-300: #E0E0E0;
  --color-gray-400: #BDBDBD;
  --color-gray-500: #9E9E9E;
  --color-gray-600: #757575;
  --color-gray-700: #616161;
  --color-gray-800: #424242;
  --color-gray-900: #212121;
  
  /* Typography - Cairo font */
  --font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-size-xs: 0.75rem;
  --font-size-sm: 0.875rem;
  --font-size-base: 1rem;
  --font-size-lg: 1.125rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 1.875rem;
  --font-size-4xl: 2.25rem;
  
  /* Spacing */
  --spacing-xs: 0.25rem;
  --spacing-sm: 0.5rem;
  --spacing-md: 1rem;
  --spacing-lg: 1.5rem;
  --spacing-xl: 2rem;
  --spacing-2xl: 3rem;
  --spacing-3xl: 4rem;
  
  /* Border Radius */
  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-2xl: 1.5rem;
  --radius-full: 9999px;
  
  /* Shadows */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.08);
  
  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

/* ============================================
   Base Styles & Reset
   ============================================ */
/* CRITICAL: Ensure eduba-theme header and dropdowns work properly */
/* Following Open edX best practices: protect header from any plugin interference */

/* Ensure header is always on top and clickable */
header.global-header,
header.global-header *,
header.global-header .main-header,
header.global-header .toggle-user-dropdown,
header.global-header .hamburger-menu {
  pointer-events: auto !important;
  cursor: pointer !important;
}

header.global-header {
  position: relative !important;
  z-index: 1000 !important;
  overflow: visible !important;
}

/* Dropdown menu positioning */
header.global-header .dropdown-user-menu {
  position: absolute !important;
  z-index: 10002 !important;
  pointer-events: auto !important;
}

header.global-header .dropdown-user-menu.hidden {
  display: none !important;
}

/* Mobile menu positioning */
header.global-header .mobile-menu {
  position: fixed !important;
  z-index: 10001 !important;
  pointer-events: auto !important;
}

header.global-header .mobile-menu.hidden {
  display: none !important;
}

/* Targeted Reset - Only apply to specific payment plugin elements */
.basket-card, .basket-card *,
.basket-header, .basket-header *,
.basket-body, .basket-body *,
.basket-items, .basket-items *,
.basket-totals, .basket-totals *,
.voucher-section, .voucher-section *,
.payment-buttons, .payment-buttons *,
.help-section, .help-section *,
.receipt-card, .receipt-card *,
.status-card, .status-card * {
  box-sizing: border-box;
}

/* Reset Legacy Global Styles Override - Only for payment plugin buttons */
.basket-card button.btn, .basket-card button.print-receipt-button, .basket-card button.payment-button,
.basket-card a.btn, .basket-card a.print-receipt-button, .basket-card a.payment-button,
.basket-card .btn, .basket-card .print-receipt-button, .basket-card .payment-button,
.basket-body button.btn, .basket-body button.print-receipt-button, .basket-body button.payment-button,
.basket-body a.btn, .basket-body a.print-receipt-button, .basket-body a.payment-button,
.basket-body .btn, .basket-body .print-receipt-button, .basket-body .payment-button,
.receipt-card button.btn, .receipt-card button.print-receipt-button, .receipt-card button.payment-button,
.receipt-card a.btn, .receipt-card a.print-receipt-button, .receipt-card a.payment-button,
.receipt-card .btn, .receipt-card .print-receipt-button, .receipt-card .payment-button,
.status-card button.btn, .status-card button.print-receipt-button, .status-card button.payment-button,
.status-card a.btn, .status-card a.print-receipt-button, .status-card a.payment-button,
.status-card .btn, .status-card .print-receipt-button, .status-card .payment-button {
  background-image: none !important;
  text-shadow: none !important;
  font-family: var(--font-family) !important;
  letter-spacing: normal !important;
}

/* REMOVED GLOBAL html, body SELECTORS - These were breaking eduba-theme header */
/* All typography now scoped to payment containers below */

/* RTL Support - Scoped to payment containers only */
.basket[dir="rtl"],
.receipt[dir="rtl"],
.status-page[dir="rtl"] {
  direction: rtl;
  text-align: right;
}

.basket[dir="ltr"],
.receipt[dir="ltr"],
.status-page[dir="ltr"] {
  direction: ltr;
  text-align: left;
}

/* ============================================
   Typography - SCOPED to payment containers
   ============================================ */
.basket h1, .basket h2, .basket h3, .basket h4, .basket h5, .basket h6,
.receipt h1, .receipt h2, .receipt h3, .receipt h4, .receipt h5, .receipt h6,
.status-page h1, .status-page h2, .status-page h3, .status-page h4, .status-page h5, .status-page h6 {
  font-family: var(--font-family);
  font-weight: 700;
  line-height: 1.3;
  color: var(--color-gray-900);
}

.basket h1, .receipt h1, .status-page h1 { font-size: var(--font-size-4xl); }
.basket h2, .receipt h2, .status-page h2 { font-size: var(--font-size-3xl); }
.basket h3, .receipt h3, .status-page h3 { font-size: var(--font-size-2xl); }
.basket h4, .receipt h4, .status-page h4 { font-size: var(--font-size-xl); }
.basket h5, .receipt h5, .status-page h5 { font-size: var(--font-size-lg); }
.basket h6, .receipt h6, .status-page h6 { font-size: var(--font-size-base); }

.basket p, .receipt p, .status-page p {
  margin-bottom: var(--spacing-md);
  color: var(--color-gray-600);
}

.basket a, .receipt a, .status-page a {
  color: var(--color-primary);
  text-decoration: none;
  transition: color var(--transition-fast);
}

.basket a:hover, .receipt a:hover, .status-page a:hover {
  color: var(--color-primary-dark);
}

/* ============================================
   Layout Components - SCOPED to payment containers
   ============================================ */
.basket .container,
.receipt .container,
.status-page .container {
  width: 100%;
  max-width: 1200px;
  margin-inline: auto;
  padding-inline: var(--spacing-lg);
}

.basket .row,
.receipt .row,
.status-page .row {
  display: flex;
  flex-wrap: wrap;
  margin-inline: calc(var(--spacing-md) * -1);
}

.basket .col,
.receipt .col,
.status-page .col {
  flex: 1;
  padding-inline: var(--spacing-md);
}

/* ============================================
   Card Component - SCOPED to payment containers
   ============================================ */
.basket .card,
.receipt .card,
.status-page .card {
  background: var(--color-white);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  transition: box-shadow var(--transition-base);
}

.basket .card:hover,
.receipt .card:hover,
.status-page .card:hover {
  box-shadow: var(--shadow-lg);
}

.basket .card-header,
.receipt .card-header,
.status-page .card-header {
  padding: var(--spacing-lg) var(--spacing-xl);
  border-bottom: 1px solid var(--color-gray-200);
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: var(--color-white);
}

.card-body {
  padding: var(--spacing-xl);
}

.card-footer {
  padding: var(--spacing-lg) var(--spacing-xl);
  border-top: 1px solid var(--color-gray-200);
  background: var(--color-gray-50);
}

/* ============================================
   Button Components
   ============================================ */
.btn {
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-md) var(--spacing-xl) !important;
  font-family: var(--font-family) !important;
  font-size: var(--font-size-base) !important;
  font-weight: 600 !important;
  line-height: 1.5 !important;
  text-align: center;
  text-decoration: none !important;
  border: 2px solid transparent !important;
  border-radius: var(--radius-lg) !important;
  cursor: pointer;
  transition: all var(--transition-fast);
  white-space: nowrap;
  box-shadow: none !important; /* Reset legacy box-shadow */
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-primary {
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%) !important;
  background-color: #E85A4F !important;
  color: #FFFFFF !important;
  border-color: var(--color-primary) !important;
  box-shadow: none !important;
}

.btn-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%) !important;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md) !important;
}

.btn-secondary {
  background: var(--color-secondary) !important;
  color: var(--color-white) !important;
  border-color: var(--color-secondary) !important;
  box-shadow: none !important;
}

.btn-secondary:hover:not(:disabled) {
  background: var(--color-secondary-dark) !important;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md) !important;
}

.btn-outline {
  background: transparent !important;
  color: var(--color-primary) !important;
  border-color: var(--color-primary) !important;
  box-shadow: none !important;
}

.btn-outline:hover:not(:disabled) {
  background: rgba(232, 90, 79, 0.1) !important;
  color: var(--color-primary-dark) !important;
  border-color: var(--color-primary-dark) !important;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md) !important;
}

.btn-success {
  background: linear-gradient(135deg, var(--color-success) 0%, #389E50 100%) !important;
  color: var(--color-white) !important;
  border-color: var(--color-success) !important;
  box-shadow: none !important;
}

.btn-success:hover:not(:disabled) {
  background: linear-gradient(135deg, #389E50 0%, var(--color-success) 100%) !important;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md) !important;
}

.btn-lg {
  padding: var(--spacing-lg) var(--spacing-2xl);
  font-size: var(--font-size-lg);
  border-radius: var(--radius-xl);
}

.btn-sm {
  padding: var(--spacing-sm) var(--spacing-md);
  font-size: var(--font-size-sm);
}

.btn-block {
  width: 100%;
}

/* ============================================
   Form Elements
   ============================================ */
.form-group {
  margin-bottom: var(--spacing-lg);
}

.form-label {
  display: block;
  margin-bottom: var(--spacing-sm);
  font-weight: 600;
  color: var(--color-gray-700);
}

.form-control {
  width: 100%;
  padding: var(--spacing-md) var(--spacing-lg);
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  color: var(--color-gray-800);
  background: var(--color-white);
  border: 2px solid var(--color-gray-300);
  border-radius: var(--radius-lg);
  transition: all var(--transition-fast);
}

.form-control:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px rgba(232, 90, 79, 0.15);
}

.form-control::placeholder {
  color: var(--color-gray-400);
}

/* ============================================
   Basket/Checkout Styles - Compact Layout
   ============================================ */
.basket {
  min-height: 100vh;
  padding: var(--spacing-lg) 0;
  padding-top: 80px;
  background: linear-gradient(180deg, var(--color-gray-100) 0%, var(--color-white) 100%);
  /* Header protection: Ensure basket doesn't block header dropdown */
  position: relative;
  z-index: 1;
  overflow: visible !important;
  pointer-events: auto;
}

.receipt,
.status-page {
  /* Header protection: Ensure these containers don't block header dropdown */
  overflow: visible !important;
}

.basket .container {
  max-width: 700px;
}

.basket-card {
  background: var(--color-white);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}

.basket-header {
  padding: var(--spacing-md) var(--spacing-lg);
  background: linear-gradient(135deg, var(--color-secondary) 0%, var(--color-secondary-dark) 100%);
  color: var(--color-white);
}

.basket-header h1 {
  font-size: var(--font-size-xl);
  color: var(--color-white);
  margin: 0;
}

.basket-body {
  padding: var(--spacing-lg);
}

.basket-items {
  margin-bottom: var(--spacing-md);
}

.basket-item {
  display: flex;
  gap: var(--spacing-md);
  padding: var(--spacing-md);
  background: var(--color-gray-50);
  border-radius: var(--radius-lg);
  margin-bottom: var(--spacing-sm);
  transition: all var(--transition-base);
  align-items: center;
}

.basket-item:last-child {
  margin-bottom: 0;
}

.basket-item:hover {
  background: var(--color-white);
  box-shadow: var(--shadow-sm);
}

.basket-item-image {
  flex-shrink: 0;
  width: 70px;
  height: 50px;
  border-radius: var(--radius-md);
  overflow: hidden;
}

.basket-item-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.basket-item-details {
  flex: 1;
  min-width: 0;
}

.basket-item-title {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--color-gray-900);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.basket-item-description {
  font-size: var(--font-size-xs);
  color: var(--color-gray-500);
}

.basket-item-description .course-id {
  font-family: monospace;
  font-size: var(--font-size-xs);
  color: var(--color-gray-600);
  background: var(--color-gray-100);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  display: inline-block;
  margin-bottom: 2px;
}

.basket-item-price {
  flex-shrink: 0;
  text-align: end;
}

[dir="rtl"] .basket-item-price {
  text-align: start;
}

.basket-item-price .price {
  font-size: var(--font-size-base);
  font-weight: 700;
  color: var(--color-primary);
}

.basket-item-price .original-price {
  font-size: var(--font-size-xs);
  color: var(--color-gray-400);
  text-decoration: line-through;
}

/* Program Bundle - Header row (title + price, no image) */
.basket-item--bundle-header {
  background: var(--color-secondary);
  color: var(--color-white);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  margin-bottom: 0;
  padding: var(--spacing-sm) var(--spacing-md);
}

.basket-item--bundle-header .basket-item-title {
  color: var(--color-white);
  font-size: var(--font-size-base);
}

.basket-item--bundle-header .basket-item-price .price {
  color: var(--color-white);
}

.basket-item--bundle-header:hover {
  background: var(--color-secondary-light);
  box-shadow: none;
}

/* Program Bundle - Course rows (indented, no price) */
.basket-item--bundle-course {
  border-radius: 0;
  margin-bottom: 0;
  padding-inline-start: calc(var(--spacing-md) + var(--spacing-lg));
  border-inline-start: 3px solid var(--color-secondary);
}

.basket-item--bundle-course:last-child {
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  margin-bottom: var(--spacing-sm);
}

/* Program badge */
.badge-program {
  display: inline-block;
  padding: 2px 8px;
  font-size: var(--font-size-xs);
  font-weight: 600;
  background: rgba(255, 255, 255, 0.2);
  color: var(--color-white);
  border-radius: var(--radius-sm);
  margin-inline-end: var(--spacing-xs);
  vertical-align: middle;
}

/* Voucher Section - Compact */
.voucher-section {
  padding: var(--spacing-sm) var(--spacing-md);
  background: var(--color-gray-50);
  border-radius: var(--radius-md);
  margin-bottom: var(--spacing-md);
}

.voucher-toggle {
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
  font-size: var(--font-size-sm);
  font-weight: 500;
  color: var(--color-primary);
  cursor: pointer;
  transition: color var(--transition-fast);
}

.voucher-toggle svg {
  width: 16px;
  height: 16px;
}

.voucher-toggle:hover {
  color: var(--color-primary-dark);
}

.voucher-form {
  display: none;
  margin-top: var(--spacing-sm);
}

.voucher-form.active {
  display: flex;
  gap: var(--spacing-sm);
  align-items: center;
}

.voucher-form .form-control {
  flex: 1;
  padding: 10px 12px !important;
  font-size: var(--font-size-sm);
  height: 40px !important;
  box-sizing: border-box;
  margin: 0 !important;
}

.voucher-form .btn,
.voucher-form .btn.btn-primary,
.voucher-form button.btn,
.voucher-form button.btn-primary,
.voucher-form button[type="submit"] {
  padding: 10px 16px !important;
  font-size: var(--font-size-sm) !important;
  height: 40px !important;
  min-width: 80px;
  background: #E85A4F !important;
  background-color: #E85A4F !important;
  background-image: none !important;
  color: #FFFFFF !important;
  border: none !important;
  border-radius: var(--radius-lg) !important;
  box-sizing: border-box;
  box-shadow: none !important;
  text-shadow: none !important;
  line-height: 1 !important;
  margin: 0 !important;
}

.voucher-form .btn:hover,
.voucher-form .btn.btn-primary:hover,
.voucher-form button.btn:hover,
.voucher-form button.btn-primary:hover,
.voucher-form button[type="submit"]:hover {
  background: #D14B41 !important;
  background-color: #D14B41 !important;
}

/* Totals Section - Compact */
.basket-totals {
  padding: var(--spacing-md);
  background: var(--color-gray-50);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-gray-200);
}

.totals-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--spacing-xs) 0;
}

.totals-row:last-child {
  padding-top: var(--spacing-sm);
  margin-top: var(--spacing-xs);
  border-top: 1px solid var(--color-gray-300);
}

.totals-label {
  font-size: var(--font-size-sm);
  font-weight: 500;
  color: var(--color-gray-600);
}

.totals-value {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--color-gray-800);
}

.totals-row:last-child .totals-label,
.totals-row:last-child .totals-value {
  font-size: var(--font-size-base);
  font-weight: 700;
}

.totals-row:last-child .totals-value {
  color: var(--color-primary);
}

/* Payment Buttons - Compact */
.payment-buttons {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  margin-top: var(--spacing-md);
}

.payment-button {
  display: flex !important;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-md) var(--spacing-lg) !important;
  font-size: var(--font-size-base) !important;
  font-weight: 600 !important;
  background: var(--color-white) !important;
  color: #1b6d99 !important;
  border: 2px solid #1b6d99 !important;
  border-radius: var(--radius-lg) !important;
  cursor: pointer;
  transition: all var(--transition-base);
  text-decoration: none !important;
  box-shadow: none !important;
}

.payment-button:hover {
  background: var(--color-white) !important;
  transform: translateY(-1px);
  box-shadow: var(--shadow-md) !important;
  color: #1b6d99 !important;
}

.payment-button svg,
.payment-button img {
  width: 20px;
  height: 20px;
}

/* Help Section - Compact */
.help-section {
  margin-top: var(--spacing-md);
  padding: var(--spacing-md);
  background: var(--color-info-light);
  border-radius: var(--radius-lg);
  border-inline-start: 3px solid var(--color-info);
}

.help-section h4 {
  font-size: var(--font-size-sm);
  color: var(--color-secondary);
  margin-bottom: var(--spacing-xs);
}

.help-section a {
