<style>
  /* ================================================
  Payment UI — design-token foundation
  ------------------------------------------------
  Component rules use live Paragon theme variables
  (`--pgn-*`) directly, with inline fallback defaults
  when absent.
  Theme authors: see docs/theme_override.rst.
  No Google Fonts, no customer palette, no `!important`
  escalation for theming.
  ================================================ */

  /* ============================================
   Scoped Reset — only payment plugin elements
   ============================================ */
  .basket-card,
  .basket-header,
  .basket-body,
  .basket-items,
  .basket-totals,
  .payment-buttons,
  .help-section,
  .receipt-card,
  .status-card,
  .order-history .oh-card {
    &,
    & * {
      box-sizing: border-box;
    }
  }

  /* Reset legacy LMS/Bootstrap button chrome (scoped for specificity) */
  .zeitlabs-payment {
    .basket-card,
    .basket-body,
    .receipt-card,
    .status-card {
      .btn,
      .print-receipt-button,
      .payment-button {
        background-image: none;
        text-shadow: none;
        font-family: var( --pgn-typography-font-family-base, var( --pgn-typography-font-family-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Kufi Arabic", sans-serif ) );
        letter-spacing: normal;
      }
    }
  }

  /* override margin-left added by LMS styles */
  .payment-buttons .payment-button {
    margin-left: initial;
  }

  /* ============================================
   RTL Support
   ============================================ */
  :is(.basket, .receipt, .receipt-wrapper, .status-page, .order-history) {
    &[dir="rtl"] {
      direction: rtl;
      text-align: end;
    }

    &[dir="ltr"] {
      direction: ltr;
      text-align: start;
    }
  }

  /* ============================================
   Typography
   ============================================ */
  :is(.basket, .receipt, .status-page, .order-history) {
    font-family: var( --pgn-typography-font-family-base, var( --pgn-typography-font-family-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Kufi Arabic", sans-serif ) );

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: var(--pgn-typography-headings-font-family, var( --pgn-typography-font-family-base, var( --pgn-typography-font-family-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Kufi Arabic", sans-serif ) ));
      font-weight: 500;
      line-height: 1.3;
      color: var(--pgn-color-gray-900, #212529);
    }

    h1 {
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 2);
      font-weight: 600;

      @media (max-width: 768px) {
        font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.875);
      }
    }

    h2,
    h3 {
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.5);

      @media (max-width: 768px) {
        font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.25);
      }
    }

    h4 {
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.25);

      @media (max-width: 768px) {
        font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.125);
      }
    }

    h5 {
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.125);
    }

    h6 {
      font-size: var(--pgn-typography-font-size-base, 1rem);
    }

    p {
      margin-block-end: var(--pgn-spacing-spacer-base, 1rem);
      color: var(--pgn-color-gray-500, #707070);
    }

    a {
      color: var(--pgn-color-primary-500, #0a3055);
      text-decoration: none;
      transition: color calc(var(--pgn-transition-base-duration, 250ms) * 0.6) var(--pgn-transition-base-timing-function, ease);

      &:hover {
        color: var(--pgn-color-primary-600, #092b4d);
      }
    }
  }

  /* ============================================
   Layout Containers
   ============================================ */
  :is(.basket, .receipt, .status-page, .order-history) {
    .container {
      width: 100%;
      max-width: 1200px;
      margin-inline: auto;
      padding-inline: calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
    }
  }

  /* ============================================
   Buttons — scoped under body.zeitlabs-payment so
   LMS/Bootstrap .btn rules lose on specificity
   ============================================ */
  .zeitlabs-payment {
    /* Shared chrome — variants keep display, gap, padding, colors, transition */
    .btn,
    .payment-button,
    .print-receipt-button,
    .go-to-course-button {
      align-items: center;
      font-family: var( --pgn-typography-font-family-base, var( --pgn-typography-font-family-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Kufi Arabic", sans-serif ) );
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
      font-weight: 500;
      border-radius: var(--pgn-size-border-radius-base, 0.375rem);
      cursor: pointer;
      box-shadow: none;
      text-decoration: none;

      &:hover,
      &:focus {
        text-decoration: none;
      }
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
      line-height: 1.5;
      text-align: center;
      border: 1px solid transparent;
      transition: all calc(var(--pgn-transition-base-duration, 250ms) * 0.6) var(--pgn-transition-base-timing-function, ease);
      min-height: 2.25rem;

      &:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        pointer-events: none;
      }
    }

    /* Primary — matches default variant: bg-primary text-primary-foreground hover:bg-pulse-500 */
    .btn-primary {
      background: var(--pgn-color-primary-500, #0a3055);
      color: var(--pgn-color-white, #ffffff);
      border-color: var(--pgn-color-primary-500, #0a3055);

      &:hover:not(:disabled),
      &:focus:not(:disabled) {
        color: var(--pgn-color-white, #ffffff);
        background: var(--pgn-color-primary-600, #092b4d);
        border-color: var(--pgn-color-primary-600, #092b4d);
      }
    }

    /* Outline-style CTAs — shared fill; hover backgrounds stay per-variant */
    .btn-outline,
    .payment-button,
    .print-receipt-button {
      background: var(--pgn-color-white, #ffffff);
      color: var(--pgn-color-primary-500, #0a3055);

      &:hover,
      &:focus {
        color: var(--pgn-color-primary-500, #0a3055);
      }
    }

    .btn-outline {
      border-color: var(--pgn-color-gray-200, #cccccc);

      &:hover:not(:disabled) {
        background: var(--pgn-color-light-200, #f8f7f6);
        border-color: var(--pgn-color-primary-500, #0a3055);
      }
    }

    .btn-lg {
      padding: var(--pgn-spacing-spacer-base, 1rem) calc(var(--pgn-spacing-spacer-base, 1rem) * 2);
      font-size: var(--pgn-typography-font-size-base, 1rem);
      border-radius: var(--pgn-size-border-radius-base, 0.375rem);
    }

    :is(.btn, .payment-button, .print-receipt-button, .go-to-course-button):hover:not(:disabled) {
      transform: translateY(-1px);
    }
  }

  /* ============================================
   Shared page shells & card chrome
   ============================================ */
  .basket,
  .receipt,
  .status-page {
    padding-block-start: 80px;
  }

  .zeitlabs-payment {
    .basket,
    .receipt,
    .status-page,
    .order-history {
      overflow: visible;
    }
  }

  .basket-card,
  .receipt-card,
  .status-card {
    background: var(--pgn-color-white, #ffffff);
    border-radius: calc(var(--pgn-size-border-radius-base, 0.375rem) * 2);
    box-shadow: var(--pgn-elevation-box-shadow-level-1, 0 1px 2px 1px rgba(167, 164, 164, 0.25));
  }

  .basket-header,
  .receipt-header {
    padding: var(--pgn-spacing-spacer-base, 1rem) calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
    background: var(--pgn-color-primary-500, #0a3055);
    color: var(--pgn-color-white, #ffffff);
  }

  .basket-body,
  .receipt-body {
    padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
  }

  /* ============================================
   Basket / Checkout
   ============================================ */
  .basket {
    padding-inline: 0;
    padding-block-end: calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
    position: relative;
    z-index: 1;
    pointer-events: auto;

    .container {
      max-width: 700px;
    }
  }

  .basket-card {
    overflow: hidden;
  }

  .basket-header h1,
  .receipt-header h2 {
    font-weight: 600;
    color: var(--pgn-color-white, #ffffff);
    margin: 0;
  }

  .basket-header h1 {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.25);

    @media (max-width: 768px) {
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.125);
    }
  }

  .basket-items {
    margin-block-end: var(--pgn-spacing-spacer-base, 1rem);
  }

  .basket-item {
    display: flex;
    gap: var(--pgn-spacing-spacer-base, 1rem);
    padding: var(--pgn-spacing-spacer-base, 1rem);
    background: var(--pgn-color-light-100, #fdfdfd);
    border-radius: var(--pgn-size-border-radius-base, 0.375rem);
    margin-block-end: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    transition: all var(--pgn-transition-base-duration, 250ms) var(--pgn-transition-base-timing-function, ease);
    align-items: center;

    &:last-child {
      margin-block-end: 0;
    }

    &:hover {
      background: var(--pgn-color-white, #ffffff);
      box-shadow: var(--pgn-elevation-box-shadow-level-1, 0 1px 2px 1px rgba(167, 164, 164, 0.25));
    }
  }

  .basket-item-image {
    flex-shrink: 0;
    width: 70px;
    height: 50px;
    border-radius: var(--pgn-size-border-radius-sm, 0.25rem);
    overflow: hidden;

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  }

  .basket-item-details {
    flex: 1;
    min-width: 0;
  }

  .basket-item-title {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
    font-weight: 500;
    color: var(--pgn-color-gray-900, #212529);
    margin-block-end: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .basket-item-description {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
    color: var(--pgn-color-gray-500, #707070);

    .course-id {
      font-family: var( --pgn-typography-font-family-monospace, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace );
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
      color: var(--pgn-color-gray-500, #707070);
      background: var(--pgn-color-light-200, #f8f7f6);
      padding: 2px 6px;
      border-radius: var(--pgn-size-border-radius-sm, 0.25rem);
      display: inline-block;
      margin-block-end: 2px;
    }
  }

  .basket-item-price {
    flex-shrink: 0;
    text-align: end;

    .price {
      font-size: var(--pgn-typography-font-size-base, 1rem);
      font-weight: 600;
      color: var(--pgn-color-primary-500, #0a3055);
    }
  }

  /* Program Bundle */
  .basket-item--bundle-header {
    background: var(--pgn-color-gray-900, #212529);
    color: var(--pgn-color-white, #ffffff);
    border-start-start-radius: var(--pgn-size-border-radius-base, 0.375rem);
    border-start-end-radius: var(--pgn-size-border-radius-base, 0.375rem);
    border-end-start-radius: 0;
    border-end-end-radius: 0;
    margin-block-end: 0;
    padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) var(--pgn-spacing-spacer-base, 1rem);

    .basket-item-title {
      color: var(--pgn-color-white, #ffffff);
      font-size: var(--pgn-typography-font-size-base, 1rem);
    }

    .basket-item-price .price {
      color: var(--pgn-color-white, #ffffff);
    }

    &:hover {
      background: var(--pgn-color-primary-600, #092b4d);
      box-shadow: none;
    }
  }

  .basket-item--bundle-course {
    border-radius: 0;
    margin-block-end: 0;
    padding-inline-start: calc(var(--pgn-spacing-spacer-base, 1rem) + calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5));
    border-inline-start: 3px solid var(--pgn-color-primary-500, #0a3055);

    &:last-child {
      border-end-start-radius: var(--pgn-size-border-radius-base, 0.375rem);
      border-end-end-radius: var(--pgn-size-border-radius-base, 0.375rem);
      margin-block-end: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    }
  }

  .badge-program {
    display: inline-block;
    padding: 2px 8px;
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
    font-weight: 500;
    background: color-mix(in srgb, var(--pgn-color-white, #ffffff) 20%, transparent);
    color: var(--pgn-color-white, #ffffff);
    border-radius: var(--pgn-size-border-radius-sm, 0.25rem);
    margin-inline-end: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.25);
    vertical-align: middle;
  }
  /* Totals */
  .basket-totals {
    padding: var(--pgn-spacing-spacer-base, 1rem);
    background: var(--pgn-color-light-100, #fdfdfd);
    border-radius: var(--pgn-size-border-radius-base, 0.375rem);
    border: 1px solid var(--pgn-color-gray-200, #cccccc);
  }

  .totals-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.25) 0;
  }

  .totals-row:last-child {
    padding-block-start: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    margin-block-start: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.25);
    border-block-start: 1px solid var(--pgn-color-gray-200, #cccccc);
  }

  .totals-label {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
    font-weight: 500;
    color: var(--pgn-color-gray-500, #707070);
  }
  .totals-value {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
    font-weight: 600;
    color: var(--pgn-color-gray-800, #333333);
  }
  .totals-row:last-child .totals-label,
  .totals-row:last-child .totals-value {
    font-size: var(--pgn-typography-font-size-base, 1rem);
    font-weight: 600;
  }
  .totals-row:last-child .totals-value {
    color: var(--pgn-color-primary-500, #0a3055);
  }

  /* Payment Buttons */
  .payment-buttons {
    display: flex;
    flex-direction: column;
    gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    margin-block-start: var(--pgn-spacing-spacer-base, 1rem);
  }

  .zeitlabs-payment .payment-button {
    display: flex;
    justify-content: center;
    gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
    border: 1px solid var(--pgn-color-gray-200, #cccccc);
    transition: all var(--pgn-transition-base-duration, 250ms) var(--pgn-transition-base-timing-function, ease);

    &:hover {
      background: var(--pgn-color-light-100, #fdfdfd);
      border-color: var(--pgn-color-primary-500, #0a3055);
    }

    svg,
    img {
      width: 20px;
      height: 20px;
    }
  }

  /* Help Section */
  .help-section {
    margin-block-start: var(--pgn-spacing-spacer-base, 1rem);
    padding: var(--pgn-spacing-spacer-base, 1rem);
    background: var(--pgn-color-info-100, #f0f6fa);
    border-radius: var(--pgn-size-border-radius-base, 0.375rem);
    border-inline-start: 3px solid var(--pgn-color-info-500, #006daa);

    h4 {
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
      color: var(--pgn-color-primary-500, #0a3055);
      margin-block-end: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.25);
      font-weight: 500;
    }

    a {
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
      color: var(--pgn-color-primary-500, #0a3055);
      font-weight: 500;
    }
  }

  /* ============================================
   Invoice / Receipt
   ============================================ */
  .receipt {
    padding-inline: var(--pgn-spacing-spacer-base, 1rem);
    padding-block-end: var(--pgn-spacing-spacer-base, 1rem);
  }

  .receipt-card {
    max-width: 800px;
    margin: 0 auto;
    overflow: hidden;
  }

  .receipt-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .receipt-header h2 {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.125);
  }
  .receipt-header .logo {
    height: 32px;
    width: auto;
  }

  .receipt-company-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
    background: var(--pgn-color-light-100, #fdfdfd);
    border-block-end: 1px solid var(--pgn-color-gray-200, #cccccc);
  }

  .receipt-company-info p {
    margin: 0;
    color: var(--pgn-color-gray-500, #707070);
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
  }

  .receipt-body h3 {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
    font-weight: 500;
    margin: 0 0 calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) 0;
    color: var(--pgn-color-gray-900, #212529);
  }

  /* Order Summary Grid */
  .order-summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    padding: var(--pgn-spacing-spacer-base, 1rem);
    background: var(--pgn-color-light-100, #fdfdfd);
    border-radius: var(--pgn-size-border-radius-base, 0.375rem);
    margin-block-end: var(--pgn-spacing-spacer-base, 1rem);
  }

  .summary-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .summary-item dt {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
    font-weight: 500;
    color: var(--pgn-color-gray-500, #707070);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .summary-item dd {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
    font-weight: 600;
    color: var(--pgn-color-gray-900, #212529);
    margin: 0;
  }

  /* Order Table */
  .order-table {
    width: 100%;
    border-collapse: collapse;
    margin-block-end: var(--pgn-spacing-spacer-base, 1rem);
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);

    thead {
      background: var(--pgn-color-primary-500, #0a3055);
      color: var(--pgn-color-white, #ffffff);
    }

    th {
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) var(--pgn-spacing-spacer-base, 1rem);
      font-weight: 600;
      text-align: start;
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
      text-transform: uppercase;
      letter-spacing: 0.3px;

      &:first-child {
        border-start-start-radius: var(--pgn-size-border-radius-base, 0.375rem);
      }

      &:last-child {
        border-start-end-radius: var(--pgn-size-border-radius-base, 0.375rem);
        text-align: end;
      }
    }

    tbody tr {
      border-block-end: 1px solid var(--pgn-color-gray-200, #cccccc);
      transition: background calc(var(--pgn-transition-base-duration, 250ms) * 0.6) var(--pgn-transition-base-timing-function, ease);

      &:hover {
        background: var(--pgn-color-light-100, #fdfdfd);
      }
    }

    td {
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) var(--pgn-spacing-spacer-base, 1rem);
      vertical-align: middle;

      &:last-child {
        text-align: end;
        font-weight: 600;
      }
    }
  }

  /* Product cell content (inside .order-table) */
  .product-name {
    font-weight: 600;
    color: var(--pgn-color-gray-900, #212529);
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
  }

  .product-description {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
    color: var(--pgn-color-gray-500, #707070);
  }

  /* Order Totals */
  .order-totals {
    width: 100%;
    max-width: 280px;
    background: var(--pgn-color-light-100, #fdfdfd);
    border-radius: var(--pgn-size-border-radius-base, 0.375rem);
    padding: var(--pgn-spacing-spacer-base, 1rem);

    .totals-row {
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
      border-block-end: 1px solid var(--pgn-color-gray-200, #cccccc);

      /* Remove border from the last invoice row, right before the total */
      &:nth-last-child(2) {
        border-bottom: none;
      }

      &:last-child {
        border-block-end: none;
        border-block-start: 2px solid var(--pgn-color-primary-500, #0a3055);

        .totals-label,
        .totals-value {
          color: var(--pgn-color-primary-500, #0a3055);
        }
      }
    }
  }

  /* QR Code */
  .qr-section {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--pgn-spacing-spacer-base, 1rem);
    padding: var(--pgn-spacing-spacer-base, 1rem);
    background: var(--pgn-color-light-100, #fdfdfd);
    border-radius: var(--pgn-size-border-radius-base, 0.375rem);
    margin-block-end: var(--pgn-spacing-spacer-base, 1rem);
  }

  .qr-code {
    flex-shrink: 0;
    padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    background: var(--pgn-color-white, #ffffff);
    border-radius: var(--pgn-size-border-radius-base, 0.375rem);
    box-shadow: var(--pgn-elevation-box-shadow-level-1, 0 1px 2px 1px rgba(167, 164, 164, 0.25));

    img,
    svg {
      display: block;
      width: 80px;
      height: 80px;
    }
  }

  /* Print Button / invoice CTAs — scoped for LMS specificity */
  .zeitlabs-payment {
    .print-receipt-button {
      display: inline-flex;
      gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.25);
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) var(--pgn-spacing-spacer-base, 1rem);
      border: 1px solid var(--pgn-color-gray-200, #cccccc);
      transition: all calc(var(--pgn-transition-base-duration, 250ms) * 0.6) var(--pgn-transition-base-timing-function, ease);

      &:hover {
        background: var(--pgn-color-light-100, #fdfdfd);
        border-color: var(--pgn-color-primary-500, #0a3055);
      }

      /* override focus state added by LMS styles */
      &:focus:not(:disabled) {
        box-shadow: none;
      }

      svg {
        width: 16px;
        height: 16px;
      }
    }

    /* Invoice Actions */
    .invoice-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    }

    .go-to-course-button {
      display: inline-flex;
      gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.25);
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) var(--pgn-spacing-spacer-base, 1rem);
      color: var(--pgn-color-white, #ffffff);
      background: var(--pgn-color-primary-500, #0a3055);
      background-image: none;
      border: 1px solid var(--pgn-color-primary-500, #0a3055);
      transition: all calc(var(--pgn-transition-base-duration, 250ms) * 0.6) var(--pgn-transition-base-timing-function, ease);
      text-shadow: none;

      &:hover,
      &:focus {
        color: var(--pgn-color-white, #ffffff);
        text-decoration: none;
        background: var(--pgn-color-primary-600, #092b4d);
        border-color: var(--pgn-color-primary-600, #092b4d);
      }
    }

    .go-to-course-button svg {
      width: 16px;
      height: 16px;
    }
  }

  /* ============================================
   Status Pages
   ============================================ */
  .status-page {
    padding-inline: var(--pgn-spacing-spacer-base, 1rem);
    padding-block-end: var(--pgn-spacing-spacer-base, 1rem);
  }

  .status-card {
    max-width: 420px;
    width: 100%;
    margin-inline: auto;
    padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 2);
    text-align: center;
  }

  .status-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto var(--pgn-spacing-spacer-base, 1rem);
    border-radius: var(--pgn-size-rounded-pill, 50rem);
    display: flex;
    align-items: center;
    justify-content: center;

    svg {
      width: 30px;
      height: 30px;
    }

    &.success {
      background: var(--pgn-color-success-100, #f1f8f5);
      color: var(--pgn-color-success-500, #178253);
    }

    &.error {
      background: var(--pgn-color-danger-100, #fbf2f3);
      color: var(--pgn-color-danger-500, #c32d3a);
    }

    &.warning {
      background: var(--pgn-color-warning-100, #fffdf0);
      color: var(--pgn-color-warning-500, #ffd900);
    }
  }

  .status-title {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.125);
    font-weight: 600;
    color: var(--pgn-color-gray-900, #212529);
    margin-block-end: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
  }

  .status-message {
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
    color: var(--pgn-color-gray-500, #707070);
    margin-block-end: var(--pgn-spacing-spacer-base, 1rem);
    line-height: 1.6;

    &:last-of-type {
      margin-block-end: calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
    }
  }

  .status-reference {
    display: inline-block;
    padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) var(--pgn-spacing-spacer-base, 1rem);
    background: var(--pgn-color-light-200, #f8f7f6);
    border-radius: var(--pgn-size-border-radius-base, 0.375rem);
    font-family: var( --pgn-typography-font-family-monospace, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace );
    font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
    color: var(--pgn-color-gray-500, #707070);
    margin-block-end: var(--pgn-spacing-spacer-base, 1rem);
    word-break: break-all;
  }

  .status-actions {
    display: flex;
    flex-direction: column;
    gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
  }

  /* Match .zeitlabs-payment .btn specificity so these variants still win */
  .zeitlabs-payment .status-actions {
    .btn {
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) var(--pgn-spacing-spacer-base, 1rem);
      border-radius: var(--pgn-size-border-radius-base, 0.375rem);
    }

    .btn-primary {
      color: var(--pgn-color-white, #ffffff);

      &:hover {
        background: var(--pgn-color-primary-600, #092b4d);
        border-color: var(--pgn-color-primary-600, #092b4d);
      }
    }

    .btn-outline {
      &:hover {
        background: var(--pgn-color-light-100, #fdfdfd);
      }
    }
  }

  /* ============================================
   Utility Classes
   ============================================ */
  .text-center {
    text-align: center;
  }

  .mt-4 {
    margin-block-start: calc(var(--pgn-spacing-spacer-base, 1rem) * 2);
  }

  .mb-3 {
    margin-block-end: calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
  }

  /* ============================================
   Responsive
   ============================================ */
  @media (max-width: 768px) {
    .container {
      padding-inline: var(--pgn-spacing-spacer-base, 1rem);
    }
    .basket {
      padding: var(--pgn-spacing-spacer-base, 1rem) 0;
    }
    .basket-body {
      padding: var(--pgn-spacing-spacer-base, 1rem);
    }
    .basket-item {
      gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    }
    .basket-item-image {
      width: 60px;
      height: 45px;
    }
    .basket-item-title {
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
    }
    .basket-item-description {
      display: none;
    }
    .basket-item-price .price {
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
    }
    .receipt-header {
      flex-direction: row;
      gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) var(--pgn-spacing-spacer-base, 1rem);
    }
    .order-summary-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .order-table {
      display: block;
      overflow-x: auto;
    }
    .order-totals {
      max-width: 100%;
    }
    .qr-section {
      flex-direction: column-reverse;
      text-align: center;
    }
    .status-card {
      padding: var(--pgn-spacing-spacer-base, 1rem);
    }
    .status-title {
      font-size: var(--pgn-typography-font-size-base, 1rem);
    }
    .payment-buttons {
      gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.25);
    }
    .zeitlabs-payment .payment-button {
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) var(--pgn-spacing-spacer-base, 1rem);
    }
  }

  @media (max-width: 480px) {
    .basket-body,
    .receipt-body {
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    }
    .basket-header,
    .receipt-header {
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5) var(--pgn-spacing-spacer-base, 1rem);
    }
    .basket-header h1 {
      font-size: var(--pgn-typography-font-size-base, 1rem);
    }
    .basket-item-image {
      width: 50px;
      height: 38px;
    }
    .order-table th,
    .order-table td {
      padding: var(--pgn-spacing-spacer-base, 1rem);
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
    }
    .help-section {
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
    }
  }

  /* ============================================
   Order History Page — Scoped under .order-history
   Follows the same pattern as .basket, .receipt, .status-page
   ============================================ */
  .order-history {
    /* ---------- Page wrapper ---------- */
    padding-block-start: 0;
    background: var(--pgn-color-light-200, #f8f7f6);
    font-family: var( --pgn-typography-font-family-base, var( --pgn-typography-font-family-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Kufi Arabic", sans-serif ) );
    position: relative;
    z-index: 1;

    /* ---------- Hero banner ---------- */
    .oh-hero {
      background: var(--pgn-color-primary-500, #0a3055);
      color: var(--pgn-color-white, #ffffff);
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 4) calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
      text-align: center;

      h1 {
        font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.5);
        font-weight: 700;
        color: var(--pgn-color-white, #ffffff);
        margin: 0;
        text-align: center;

        @media (max-width: 768px) {
          font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.25);
        }
      }

      p {
        color: color-mix(in srgb, var(--pgn-color-white, #ffffff) 85%, transparent);
        margin: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.25) 0 0;
        font-size: var(--pgn-typography-font-size-base, 1rem);
        text-align: center;
      }
    }

    /* ---------- Content card ---------- */
    .oh-card {
      background: var(--pgn-color-white, #ffffff);
      border-radius: calc(var(--pgn-size-border-radius-base, 0.375rem) * 2);
      box-shadow: var( --pgn-elevation-box-shadow-level-4, 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05) );
      border: 1px solid var(--pgn-color-gray-200, #cccccc);
      max-width: 960px;
      margin: calc(calc(var(--pgn-spacing-spacer-base, 1rem) * 2) * -0.5) auto calc(var(--pgn-spacing-spacer-base, 1rem) * 3);
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 2);
      position: relative;
      z-index: 2;
    }

    .oh-card-title {
      color: var(--pgn-color-gray-900, #212529);
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.25);
      font-weight: 700;
      text-align: center;
      margin: 0 0 calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5);
      padding-block-end: var(--pgn-spacing-spacer-base, 1rem);
      border-block-end: 2px solid var(--pgn-color-gray-200, #cccccc);

      @media (max-width: 768px) {
        font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.125);
      }
    }

    /* ---------- Order table — a real table on wide screens,
       stacked cards below 768px; one markup tree either way ---------- */
    .oh-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: match-parent;

      thead th {
        background-color: var(--pgn-color-light-100, #fdfdfd);
        color: var(--pgn-color-gray-500, #707070);
        font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: var(--pgn-spacing-spacer-base, 1rem) var(--pgn-spacing-spacer-base, 1rem);
        border-block-end: 2px solid var(--pgn-color-gray-200, #cccccc);
        white-space: nowrap;
      }

      tbody tr {
        transition: background-color calc(var(--pgn-transition-base-duration, 250ms) * 0.6) var(--pgn-transition-base-timing-function, ease);

        &:hover {
          background-color: var(--pgn-color-light-100, #fdfdfd);
        }

        &:last-child td {
          border-block-end: none;
        }
      }

      td {
        padding: var(--pgn-spacing-spacer-base, 1rem);
        border-block-end: 1px solid var(--pgn-color-gray-200, #cccccc);
        color: var(--pgn-color-gray-800, #333333);
        font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
        vertical-align: middle;
      }

      .oh-col-date {
        white-space: nowrap;
        color: var(--pgn-color-gray-500, #707070);
      }

      .oh-col-invoice a {
        color: var(--pgn-color-primary-500, #0a3055);
        font-weight: 600;
        text-decoration: none;

        &:hover {
          color: var(--pgn-color-gray-900, #212529);
          text-decoration: underline;
        }
      }

      .oh-col-item {
        max-width: 280px;

        a {
          color: var(--pgn-color-gray-800, #333333);
          text-decoration: none;
          font-weight: 500;

          &:hover {
            color: var(--pgn-color-primary-500, #0a3055);
          }
        }
      }

      .oh-col-amount {
        font-weight: 700;
        white-space: nowrap;
        color: var(--pgn-color-gray-900, #212529);
      }
    }

    /* ---------- Item type badge ---------- */
    .oh-item-type {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--pgn-size-border-radius-sm, 0.25rem);
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
      font-weight: 600;
      margin-block-end: 2px;
      background-color: var(--pgn-color-info-100, #f0f6fa);
      color: var(--pgn-color-gray-900, #212529);
    }

    /* ---------- Status badge ---------- */
    .oh-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: var(--pgn-size-rounded-pill, 50rem);
      font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.75);
      font-weight: 600;
      white-space: nowrap;
      /* Default: gray */
      background-color: var(--pgn-color-gray-200, #cccccc);
      color: var(--pgn-color-gray-500, #707070);

      &[data-status="paid"] {
        background-color: var(--pgn-color-success-100, #f1f8f5);
        color: var(--pgn-color-success-500, #178253);
      }

      &[data-status="pending"],
      &[data-status="payment_pending"],
      &[data-status="processing"],
      &[data-status="confirming"] {
        background-color: var(--pgn-color-warning-100, #fffdf0);
        color: var(--pgn-color-warning-500, #ffd900);
      }

      &[data-status="cancelled"],
      &[data-status="refunded"],
      &[data-status="refund_requested"] {
        background-color: var(--pgn-color-danger-100, #fbf2f3);
        color: var(--pgn-color-danger-500, #c32d3a);
      }
    }

    /* ---------- Pager ---------- */
    .oh-pager {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }

    /* ---------- Empty state ---------- */
    .oh-empty {
      text-align: center;
      padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 4) var(--pgn-spacing-spacer-base, 1rem);

      p {
        color: var(--pgn-color-gray-500, #707070);
        font-size: var(--pgn-typography-font-size-base, 1rem);
        margin: 0;
      }
    }

    .oh-empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto var(--pgn-spacing-spacer-base, 1rem);
      background: var(--pgn-color-light-200, #f8f7f6);
      border-radius: var(--pgn-size-rounded-pill, 50rem);
      display: flex;
      align-items: center;
      justify-content: center;

      svg {
        width: 28px;
        height: 28px;
        color: var(--pgn-color-gray-500, #707070);
      }
    }

    /* ---------- Tablet breakpoint (768px) ---------- */
    @media (max-width: 768px) {
      .oh-hero {
        padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 2) var(--pgn-spacing-spacer-base, 1rem);

        p {
          font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 0.875);
        }
      }

      .oh-card {
        margin-inline: var(--pgn-spacing-spacer-base, 1rem);
        padding: var(--pgn-spacing-spacer-base, 1rem);
      }

      /* Each invoice stacks into a card; the header row would only repeat fields
         that already describe themselves — date, invoice link, title, amount with
         its currency symbol, and the status label. */
      .oh-table,
      .oh-table tbody {
        display: block;
      }

      .oh-table thead {
        display: none;
      }

      .oh-table tbody tr {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "status date"
          "item item"
          "amount invoice";
        align-items: center;
        column-gap: var(--pgn-spacing-spacer-base, 1rem);
        row-gap: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
        background: var(--pgn-color-white, #ffffff);
        border: 1px solid var(--pgn-color-gray-200, #cccccc);
        border-radius: var(--pgn-size-border-radius-lg, 0.425rem);
        box-shadow: var(--pgn-elevation-box-shadow-level-1, 0 1px 2px 1px rgba(167, 164, 164, 0.25));
        padding: var(--pgn-spacing-spacer-base, 1rem);
        margin-block-end: var(--pgn-spacing-spacer-base, 1rem);
      }

      .oh-table tbody tr:hover {
        background-color: var(--pgn-color-white, #ffffff);
      }

      .oh-table tbody tr:last-child {
        margin-block-end: 0;
      }

      .oh-table td {
        display: block;
        padding: 0;
        border-block-end: none;
        max-width: none;
      }

      .oh-table .oh-col-status {
        grid-area: status;
        justify-self: start;
      }

      .oh-table .oh-col-date {
        grid-area: date;
        justify-self: end;
      }

      .oh-table .oh-col-item {
        grid-area: item;
      }

      .oh-table .oh-col-amount {
        grid-area: amount;
        justify-self: start;
        font-size: var(--pgn-typography-font-size-base, 1rem);
      }

      .oh-table .oh-col-invoice {
        grid-area: invoice;
        justify-self: end;
      }
    }

    /* ---------- Small mobile (480px) ---------- */
    @media (max-width: 480px) {
      .oh-hero {
        padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 1.5) calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);

        h1 {
          font-size: calc(var(--pgn-typography-font-size-base, 1rem) * 1.125);
        }
      }

      .oh-card {
        margin-inline: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
        padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
        border-radius: var(--pgn-size-border-radius-lg, 0.425rem);
      }

      .oh-table tbody tr {
        padding: calc(var(--pgn-spacing-spacer-base, 1rem) * 0.5);
      }
    }

    /* ---------- Print styles ---------- */
    @media print {
      .oh-hero {
        display: none;
      }

      .oh-card {
        box-shadow: none;
        border: none;
        margin: 0;
        max-width: 100%;
      }

      /* Printing always shows the table, never the stacked-card screen layout. */
      .oh-table {
        display: table;
      }

      .oh-table thead {
        display: table-header-group;
      }

      .oh-table tbody {
        display: table-row-group;
      }

      .oh-table tbody tr {
        display: table-row;
        background: none;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 0;
        margin: 0;
      }

      .oh-table td {
        display: table-cell;
        padding: var(--pgn-spacing-spacer-base, 1rem);
        border-block-end: 1px solid var(--pgn-color-gray-200, #cccccc);
        max-width: none;
      }

      .oh-table tbody tr:hover {
        background-color: transparent;
      }

      .oh-status {
        border: 1px solid currentColor;
      }
    }
  }

  /* ============================================
   Wait Feedback / Processing Card
